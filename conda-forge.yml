build_platform:
  linux_ppc64le: linux_64
  linux_riscv64: linux_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
idle_timeout_minutes: 30
remote_ci_setup:
- conda-forge-ci-setup=4
- conda-build <24.11
provider:
  linux_aarch64: default
  osx_arm64: default
  win_arm64: default
test: native_and_emulated
